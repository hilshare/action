name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # test/test_submit.py runs submit.py against a fake service in its own process.
      - name: Tests
        run: python3 -m unittest discover -s test
      # actionlint reads workflows only, so this step parses the composite action.
      - name: The composite action parses
        run: python3 -c "import yaml; yaml.safe_load(open('action.yml'))"

  workflows:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The step uses a pinned version. It downloads a release tarball and does not pipe a
      # script into a shell.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
      - name: Lint the workflows
        run: ./actionlint -color
